project:
  seed: 20260824

dataset:
  repo_id: ControlNet/AV-Deepfake1M-PlusPlus
  split: train
  metadata:
    - data/raw/avpp/train_metadata.json
    - data/raw/avpp/val_metadata.json
  inventory_database: data/manifests/avpp_inventory.sqlite
  pilot_manifest: data/manifests/train_subset5000.csv
  extracted_root: data/extracted/avpp/train-subset5000/train

sampling:
  per_category: 1250
  categories:
    - real
    - audio_modified
    - visual_modified
    - both_modified
  require_unique_originals: true

preprocessing:
  output_dir: outputs/train-subset5000
  ffmpeg_path: null
  ffprobe_path: null
  whisper_model: base.en
  whisper_device: cpu
  whisper_compute_type: int8
  mfa_docker_image: mmcauliffe/montreal-forced-aligner:latest
  mfa_dictionary: english_us_arpa
  mfa_acoustic_model: english_us_arpa
  mfa_cache_dir: data/cache/mfa
  event_window_before_s: 0.20
  event_window_after_s: 0.20
  manipulation_boundary_tolerance_s: 0.04
  min_valid_landmark_ratio: 0.80
  min_bilabial_events: 1
  max_debug_overlays_per_video: 1
  audio_enhancement:
    enabled: true
    model_cache_dir: data/cache/audio_models
    demucs_model: htdemucs
    demucs_device: cuda
    demucs_segment_seconds: 7
    demucs_shifts: 0
    demucs_overlap: 0.25
    deepfilter_executable: null
    deepfilter_model: DeepFilterNet3
    deepfilter_compensate_delay: true
    deepfilter_post_filter: false
    deepfilter_attenuation_limit_db: 10
    deepfilter_fallback_enabled: true
  vild_trace:
    enabled: true
    reference_window_seconds: 0.08
    max_reference_windows: 8
    speech_margin_seconds: 0.02
