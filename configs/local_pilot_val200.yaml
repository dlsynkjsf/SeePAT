# Development pilot; run from SeePAT-feat-improvement. Counts are before eligibility filtering.
# Nested Train selection and a shared internal Validation subset; not a historical reproduction.
project:
  seed: 20260822
dataset:
  split: val
  pilot_manifest: data/manifests/local_pilots_v1/val200.csv
  extracted_root: ../Videos_Dataset/SeePAT_dataset_5000_train_1000_val/val
preprocessing:
  output_dir: outputs/local_pilots_v1/preprocess/val200
  ffmpeg_path: null
  ffprobe_path: null
  whisper_model: base.en
  whisper_device: cpu
  whisper_compute_type: int8
  mfa_docker_image: mmcauliffe/montreal-forced-aligner:latest
  mfa_dictionary: english_us_arpa
  mfa_acoustic_model: english_us_arpa
  mfa_cache_dir: data/cache/mfa
  event_window_before_s: 0.2
  event_window_after_s: 0.2
  manipulation_boundary_tolerance_s: 0.04
  min_valid_landmark_ratio: 0.8
  min_bilabial_events: 1
  max_debug_overlays_per_video: 1
  audio_enhancement:
    enabled: true
    model_cache_dir: data/cache/audio_models
    demucs_model: htdemucs
    demucs_device: cuda
    demucs_segment_seconds: 7
    demucs_shifts: 0
    demucs_overlap: 0.25
    deepfilter_executable: null
    deepfilter_model: DeepFilterNet3
    deepfilter_compensate_delay: true
    deepfilter_post_filter: false
    deepfilter_attenuation_limit_db: 10
    deepfilter_fallback_enabled: true
  vild_trace:
    enabled: true
    reference_window_seconds: 0.08
    max_reference_windows: 8
    speech_margin_seconds: 0.02
