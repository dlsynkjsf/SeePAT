# New local-subset experiment; does not reproduce a frozen Phase-5 context run.
# Run from SeePAT-feat-improvement. Uploaded media and original profiles remain unchanged.
report: outputs/local_subset_v1/workflow_training_summary.json
model_training:
- name: local-subset-fusion
  model: swin3d_b_vild_fusion
  train_manifest: outputs/local_subset_v1/calibration/events_train_calibrated.csv
  validation_manifest: outputs/local_subset_v1/calibration/events_val_calibrated.csv
  output_dir: outputs/local_subset_v1/training/fusion
  readiness_dir: outputs/local_subset_v1/readiness/fusion
  project_root: .
  device: cuda
  pretrained: true
  options:
    epochs: 10
    batch_size: 1
    workers: 2
    learning_rate: 0.0001
    weight_decay: 0.01
    gradient_accumulation_steps: 4
    sequence_length: 16
    image_size: 224
    seed: 20261030
    amp: false
    freeze_backbone: true
    unfreeze_final_backbone_stages: false
    class_weighting: balanced_global
    loss_function: cross_entropy
    supervision: video_max
    selection_metric: validation_video_balanced_accuracy
    early_stopping_patience: 3
    max_train_batches: null
    max_validation_batches: null
  runtime:
    feature_cache_dir: .cache/local_subset_v1/frozen_encoders
    clip_cache_dir: null
    persistent_train_workers: true
