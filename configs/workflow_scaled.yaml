# =============================================================================
# SeePAT whole-pipeline workflow - scaled run (AV++ Train 5,000 / Val 1,000).
#
# Stage 0 - AV++ dataset subsetting. NOT executed by seepat-workflow; run these
# once from the repo root (skip any step whose outputs already exist):
#
#   seepat-data build-inventory \
#     --metadata data/raw/avpp/train_metadata.json \
#     --metadata data/raw/avpp/val_metadata.json \
#     --database data/manifests/avpp_inventory.sqlite \
#     --summary outputs/avpp_inventory_summary.json
#
#   seepat-data sample-training-canary \
#     --database data/manifests/avpp_inventory.sqlite \
#     --output data/manifests/train_subset5000.csv \
#     --summary outputs/train_subset5000_sample_summary.json \
#     --split train --per-category 1250 --seed 20260824 --exclude-split val
#
#   seepat-data sample-pilot \
#     --database data/manifests/avpp_inventory.sqlite \
#     --output data/manifests/val_subset1000.csv \
#     --split val --per-category 250 --seed 20260822
#
#   seepat-data extract-pilot \
#     --archive /path/to/avpp_train.7z.001 \
#     --manifest data/manifests/train_subset5000.csv \
#     --output-dir data/extracted/avpp/train-subset5000 \
#     --report outputs/extract_train_subset5000.json
#
#   seepat-data extract-pilot \
#     --archive /path/to/avpp_val.7z.001 \
#     --manifest data/manifests/val_subset1000.csv \
#     --output-dir data/extracted/avpp/val-subset1000 \
#     --report outputs/extract_val_subset1000.json
#
# Keep dataset.extracted_root in configs/train_scaled.yaml / val_scaled.yaml in
# sync with each report's `extracted_data_root` (the archive adds a root folder).
#
# Stages 1-3 (preprocess + training manifests -> calibration -> model training)
# run with:
#   seepat-workflow --config configs/workflow_scaled.yaml
# =============================================================================

dataset_subsetting:  # reference parameters for stage 0 (not read by seepat-workflow)
  inventory_database: data/manifests/avpp_inventory.sqlite
  train:
    command: sample-training-canary
    manifest: data/manifests/train_subset5000.csv
    summary: outputs/train_subset5000_sample_summary.json
    split: train
    per_category: 1250
    seed: 20260824
    exclude_split: val
  val:
    command: sample-pilot
    manifest: data/manifests/val_subset1000.csv
    split: val
    per_category: 250
    seed: 20260822
  extraction:
    train:
      archive: /path/to/avpp_train.7z.001
      output_dir: data/extracted/avpp/train-subset5000
      report: outputs/extract_train_subset5000.json
    val:
      archive: /path/to/avpp_val.7z.001
      output_dir: data/extracted/avpp/val-subset1000
      report: outputs/extract_val_subset1000.json

report: outputs/workflow_scaled_summary.json
decisions:
  - name: validation-decisions
    validation_manifest: outputs/numerical_calibration/guarded_per_video_v3/events_val_calibrated.csv
    source_manifest: data/manifests/val_subset1000.csv
    output_dir: outputs/decisions/guarded_fusion
    # Set this to the selected best checkpoint only after a full model experiment.
    # Preflight checkpoints are refused; null defers all three downstream stages.
    checkpoint: null
    device: cuda
    batch_size: 1

jobs:
  - name: train-subset5000
    pipeline_config: configs/train_scaled.yaml
    manifest_output_dir: data/training/train-subset5000

  - name: val-subset1000
    pipeline_config: configs/val_scaled.yaml
    manifest_output_dir: data/training/val-subset1000

trace_augmentation:
  - name: train-vild-augmentation
    manifest: data/training/train-subset5000/events_train.csv
    extracted_root: data/extracted/avpp/train-subset5000/train
    output_dir: outputs/trace_augmentation/train
  - name: val-vild-augmentation
    manifest: data/training/val-subset1000/events_val.csv
    extracted_root: data/extracted/avpp/val-subset1000/val
    output_dir: outputs/trace_augmentation/val

numerical_calibration:
  name: guarded-vild-calibration
  train_manifest: outputs/trace_augmentation/train/events_augmented.csv
  score_manifests:
    train: outputs/trace_augmentation/train/events_augmented.csv
    val: outputs/trace_augmentation/val/events_augmented.csv
  output_dir: outputs/numerical_calibration/guarded_per_video_v3
  min_video_reference_frames: 16
  isolation_trees: 100
  random_seed: 20260908

model_training:
  - name: local-swin-preflight
    model: swin3d_b
    train_manifest: data/training/train-subset5000/events_train.csv
    validation_manifest: data/training/val-subset1000/events_val.csv
    output_dir: outputs/training/local_swin_preflight_guarded
    project_root: .
    device: cuda
    pretrained: true
    options:
      epochs: 1
      batch_size: 1
      workers: 0
      learning_rate: 0.0001
      weight_decay: 0.01
      gradient_accumulation_steps: 1
      sequence_length: 16
      image_size: 224
      seed: 20260823
      amp: true
      freeze_backbone: true
      class_weighting: balanced
      early_stopping_patience: 3
      max_train_batches: 5
      max_validation_batches: 3

  - name: local-cnn-temporal-preflight
    model: efficientnet_v2_s_tempcnn
    train_manifest: data/training/train-subset5000/events_train.csv
    validation_manifest: data/training/val-subset1000/events_val.csv
    output_dir: outputs/training/local_cnn_temporal_preflight_guarded_fp32
    project_root: .
    device: cuda
    pretrained: false
    options:
      epochs: 1
      batch_size: 1
      workers: 0
      learning_rate: 0.0001
      weight_decay: 0.01
      gradient_accumulation_steps: 1
      sequence_length: 16
      image_size: 224
      seed: 20260903
      amp: false  # The earlier AMP preflight completed without an optimizer update.
      freeze_backbone: true
      class_weighting: balanced
      early_stopping_patience: 3
      max_train_batches: 2
      max_validation_batches: 1

  # Commit 2: isolated fusion state; two bounded epochs, no weight downloads.
  # The optional first-epoch preflight config uses this same output directory.
  - name: local-fusion-preflight
    model: swin3d_b_vild_fusion
    train_manifest: outputs/numerical_calibration/guarded_per_video_v3/events_train_calibrated.csv
    validation_manifest: outputs/numerical_calibration/guarded_per_video_v3/events_val_calibrated.csv
    output_dir: outputs/training/local_fusion_preflight_guarded_v3
    project_root: .
    device: cuda
    pretrained: false
    options:
      epochs: 2
      batch_size: 1
      workers: 0
      learning_rate: 0.0001
      weight_decay: 0.01
      gradient_accumulation_steps: 2
      sequence_length: 16
      image_size: 224
      seed: 20260915
      amp: false  # A one-update preflight must not be consumed by AMP scale warmup.
      freeze_backbone: true
      class_weighting: balanced
      early_stopping_patience: 3
      max_train_batches: 2
      max_validation_batches: 1
