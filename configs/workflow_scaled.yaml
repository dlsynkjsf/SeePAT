report: outputs/workflow_scaled_summary.json

jobs:
  - name: train-subset5000
    pipeline_config: configs/train_subset5000.yaml
    manifest_output_dir: data/training/train-subset5000

  - name: val-subset1000
    pipeline_config: configs/val_subset1000.yaml
    manifest_output_dir: data/training/val-subset1000

model_training:
  name: local-swin-preflight
  train_manifest: data/training/train-subset5000/events_train.csv
  validation_manifest: data/training/val-subset1000/events_val.csv
  output_dir: outputs/training/local_swin_preflight
  project_root: .
  device: cuda
  pretrained: true
  options:
    epochs: 1
    batch_size: 1
    workers: 0
    learning_rate: 0.0001
    weight_decay: 0.01
    gradient_accumulation_steps: 1
    sequence_length: 16
    image_size: 224
    seed: 20260823
    amp: true
    freeze_backbone: true
    class_weighting: balanced
    early_stopping_patience: 3
    max_train_batches: 5
    max_validation_batches: 3
