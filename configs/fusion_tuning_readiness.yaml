# Bounded readiness for the three frozen full-fusion tuning candidates.
# Run at epoch 1, change the shared epochs value to 2, then rerun to prove resume.
report: outputs/workflow_fusion_tuning_readiness_summary.json

model_training:
  - &candidate
    name: readiness-fusion-auto-balanced
    model: swin3d_b_vild_fusion
    train_manifest: &train outputs/numerical_calibration/guarded_per_video_v3/events_train_calibrated.csv
    validation_manifest: &val outputs/numerical_calibration/guarded_per_video_v3/events_val_calibrated.csv
    output_dir: outputs/training/fusion_tuning_v1/readiness/auto_balanced
    project_root: .
    device: cuda
    pretrained: true
    options: &options
      epochs: 1
      batch_size: 1
      workers: 0
      learning_rate: 0.0001
      weight_decay: 0.01
      gradient_accumulation_steps: 4
      sequence_length: 16
      image_size: 224
      seed: 20260916
      amp: false
      freeze_backbone: true
      class_weighting: balanced_global
      positive_class_weight_ratio: null
      selection_metric: validation_video_balanced_accuracy
      early_stopping_patience: 3
      max_train_batches: 16
      max_validation_batches: 8

  - <<: *candidate
    name: readiness-fusion-ratio20
    output_dir: outputs/training/fusion_tuning_v1/readiness/ratio20
    options:
      <<: *options
      positive_class_weight_ratio: 20.0

  - <<: *candidate
    name: readiness-fusion-ratio10
    output_dir: outputs/training/fusion_tuning_v1/readiness/ratio10
    options:
      <<: *options
      positive_class_weight_ratio: 10.0
