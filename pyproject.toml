[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seepat"
version = "0.1.0"
description = "Evidence-aware bilabial alignment pipeline for audio-visual deepfake detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "huggingface-hub>=1.0,<2",
  "ijson>=3.3,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
preprocess = [
  "faster-whisper>=1.1,<2",
  # Last Windows release with the FaceMesh Solutions API used by this project.
  "mediapipe==0.10.21",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]
audio = [
  "demucs==4.1.0",
  "deepfilternet==0.5.6",
  "torchaudio==2.12.1",
]
train = [
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
  "torch==2.12.1",
  "torchvision==0.27.1",
]

[project.scripts]
seepat-data = "seepat.cli:main"
seepat-workflow = "seepat.workflow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
